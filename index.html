<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title></title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0b0b0a;
}

body {
  touch-action: none;
  cursor: none;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

/* extremely quiet interface */

.mark {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translateX(-50%);
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: rgba(255,255,255,.22);
  pointer-events: none;
  z-index: 5;
}

.cursor {
  position: fixed;
  width: 14px;
  height: 14px;
  border: 1px solid rgba(255,255,255,.6);
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%,-50%);
  z-index: 10;
  mix-blend-mode: difference;
}

@media (pointer: coarse) {
  .cursor {
    display: none;
  }
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="mark"></div>

<div class="cursor" id="cursor"></div>


<script>

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const cursor =
  document.getElementById("cursor");


let W;
let H;
let DPR;


/* ---------------------------------------
   INPUT
--------------------------------------- */

const pointer = {
  x: 0,
  y: 0,
  active: false,
  down: false,
  strength: 0
};


/* ---------------------------------------
   OBJECT
--------------------------------------- */

let particles = [];

const PARTICLES = 1100;


/* ---------------------------------------
   RESIZE
--------------------------------------- */

function resize() {

  W = window.innerWidth;
  H = window.innerHeight;

  DPR =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  canvas.width =
    W * DPR;

  canvas.height =
    H * DPR;

  canvas.style.width =
    W + "px";

  canvas.style.height =
    H + "px";

  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );

  createObject();
}

window.addEventListener(
  "resize",
  resize
);


/* ---------------------------------------
   CREATE THE FORM
--------------------------------------- */

function createObject() {

  particles = [];

  const cx = W / 2;
  const cy = H / 2;

  const scale =
    Math.min(W,H);

  const rx =
    scale * .27;

  const ry =
    scale * .34;


  for (
    let i = 0;
    i < PARTICLES;
    i++
  ) {

    const a =
      Math.random() *
      Math.PI * 2;

    /*
      biased distribution:
      more mass toward the outer skin
    */

    const r =
      Math.pow(
        Math.random(),
        .48
      );


    /*
      irregular organic boundary
    */

    const distortion =
      1 +
      Math.sin(a * 3.0) * .08 +
      Math.sin(a * 7.0) * .035;


    const x =
      cx +
      Math.cos(a) *
      rx *
      r *
      distortion;

    const y =
      cy +
      Math.sin(a) *
      ry *
      r *
      distortion;


    particles.push({

      x,
      y,

      homeX: x,
      homeY: y,

      vx: 0,
      vy: 0,

      size:
        .35 +
        Math.random() * 1.5,

      alpha:
        .12 +
        Math.random() * .48,

      phase:
        Math.random() * Math.PI * 2,

      speed:
        .15 +
        Math.random() * .45

    });

  }
}


/* ---------------------------------------
   POINTER
--------------------------------------- */

function movePointer(x,y) {

  pointer.x = x;
  pointer.y = y;
  pointer.active = true;

  if (cursor) {

    cursor.style.left =
      x + "px";

    cursor.style.top =
      y + "px";

  }
}


window.addEventListener(
  "mousemove",
  function(e) {

    movePointer(
      e.clientX,
      e.clientY
    );

  }
);


window.addEventListener(
  "mousedown",
  function() {

    pointer.down = true;

  }
);


window.addEventListener(
  "mouseup",
  function() {

    pointer.down = false;

  }
);


/* ---------------------------------------
   TOUCH
--------------------------------------- */

window.addEventListener(
  "touchstart",
  function(e) {

    const touch =
      e.touches[0];

    movePointer(
      touch.clientX,
      touch.clientY
    );

    pointer.down = true;

  },
  { passive: false }
);


window.addEventListener(
  "touchmove",
  function(e) {

    e.preventDefault();

    const touch =
      e.touches[0];

    movePointer(
      touch.clientX,
      touch.clientY
    );

  },
  { passive: false }
);


window.addEventListener(
  "touchend",
  function() {

    pointer.down = false;

  }
);


/* ---------------------------------------
   DRAW
--------------------------------------- */

function draw(time) {

  const t =
    time * .001;


  /*
    background
  */

  ctx.fillStyle =
    "#0b0b0a";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /*
    extremely subtle atmospheric glow
  */

  const glow =
    ctx.createRadialGradient(
      W/2,
      H/2,
      0,
      W/2,
      H/2,
      Math.min(W,H) * .55
    );

  glow.addColorStop(
    0,
    "rgba(255,255,255,.025)"
  );

  glow.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );

  ctx.fillStyle =
    glow;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /*
    object physics
  */

  let nearest =
    Infinity;


  for (
    let i = 0;
    i < particles.length;
    i++
  ) {

    const p =
      particles[i];


    /*
      living movement
    */

    const breathing =
      Math.sin(
        t * p.speed +
        p.phase
      );


    const targetX =
      p.homeX +
      breathing *
      Math.sin(p.phase) *
      2.2;


    const targetY =
      p.homeY +
      breathing *
      Math.cos(p.phase) *
      2.2;


    /*
      mouse interaction
    */

    if (pointer.active) {

      const dx =
        p.x -
        pointer.x;

      const dy =
        p.y -
        pointer.y;

      const d2 =
        dx*dx +
        dy*dy;

      const radius =
        pointer.down
          ? 190
          : 125;


      if (d2 < radius * radius) {

        const d =
          Math.sqrt(d2) || 1;

        nearest =
          Math.min(
            nearest,
            d
          );


        const force =
          (1 - d/radius);


        const angle =
          Math.atan2(
            dy,
            dx
          );


        /*
          holding pushes harder
        */

        const power =
          pointer.down
            ? 2.7
            : .65;


        p.vx +=
          Math.cos(angle) *
          force *
          power;

        p.vy +=
          Math.sin(angle) *
          force *
          power;

      }

    }


    /*
      return to original form
    */

    p.vx +=
      (targetX - p.x) *
      .003;

    p.vy +=
      (targetY - p.y) *
      .003;


    /*
      subtle attraction toward center
      when released
    */

    if (!pointer.down) {

      const cx =
        W/2;

      const cy =
        H/2;

      p.vx +=
        (cx - p.x) *
        .000015;

      p.vy +=
        (cy - p.y) *
        .000015;

    }


    /*
      friction
    */

    p.vx *= .935;
    p.vy *= .935;


    p.x += p.vx;
    p.y += p.vy;


    /*
      draw particle
    */

    const pulse =
      Math.sin(
        t * .8 +
        p.phase
      ) * .12;


    ctx.fillStyle =
      `rgba(
        235,
        232,
        225,
        ${Math.max(
          .03,
          p.alpha + pulse
        )}
      )`;


    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI * 2
    );

    ctx.fill();

  }


  /*
    connect only nearby particles
    around the disturbed region
  */

  if (
    pointer.active &&
    nearest < 100
  ) {

    for (
      let i = 0;
      i < particles.length;
      i += 4
    ) {

      const p =
        particles[i];

      const dx =
        p.x -
        pointer.x;

      const dy =
        p.y -
        pointer.y;

      const d =
        Math.sqrt(
          dx*dx +
          dy*dy
        );


      if (d < 90) {

        ctx.strokeStyle =
          `rgba(
            235,
            232,
            225,
            ${(.055 *
              (1-d/90))}
          )`;

        ctx.lineWidth =
          .5;

        ctx.beginPath();

        ctx.moveTo(
          p.x,
          p.y
        );

        ctx.lineTo(
          pointer.x,
          pointer.y
        );

        ctx.stroke();

      }

    }

  }


  /*
    rare internal flash

    Something deep inside the object
    occasionally becomes visible.
  */

  const flash =
    Math.sin(t * .17);

  if (flash > .995) {

    const radius =
      Math.min(W,H) * .055;

    ctx.beginPath();

    ctx.arc(
      W/2,
      H/2,
      radius,
      0,
      Math.PI * 2
    );

    ctx.strokeStyle =
      "rgba(255,255,255,.12)";

    ctx.lineWidth =
      .6;

    ctx.stroke();

  }


  requestAnimationFrame(
    draw
  );

}


resize();

requestAnimationFrame(
  draw
);

</script>

</body>
</html>
