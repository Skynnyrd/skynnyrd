<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0a">
  <title>Peaceful Visitors Chasing Rabbits</title>

  <style>
    :root {
      color-scheme: dark;
      background: #0b0b0a;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: radial-gradient(
        ellipse at 50% 46%,
        #211f1a 0%,
        #121210 35%,
        #0b0b0a 75%
      );
      display: grid;
      place-items: center;
      user-select: none;
      -webkit-user-select: none;
    }

    .room {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: grid;
      place-items: center;
      isolation: isolate;
      overflow: hidden;
    }

    .light {
      position: absolute;
      width: min(78vw, 780px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(154, 126, 83, .085) 0%,
        rgba(101, 83, 57, .035) 36%,
        transparent 70%
      );
      filter: blur(28px);
      pointer-events: none;
    }

    /* Desktop: keep the complete object inside the viewport. */
    .artifact {
      position: relative;
      width: min(70vw, 480px);
      height: 88vh;
      height: 88dvh;
      display: grid;
      place-items: center;
      animation: arrival 2.8s ease-out both;
      will-change: transform;
      cursor: default;
      -webkit-tap-highlight-color: transparent;
    }

    .object-image {
      position: relative;
      width: 100%;
      height: 100%;
      background-image: url("object.png");
      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      animation: breathing 12s ease-in-out infinite;
      transform-origin: center;
    }

    /* The light is normally invisible. It appears only when awakened. */
    .inner-light {
      position: absolute;
      inset: 12%;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(
        ellipse at 50% 50%,
        rgba(255, 184, 83, .34) 0%,
        rgba(195, 126, 47, .16) 24%,
        rgba(130, 79, 30, .07) 43%,
        transparent 68%
      );
      filter: blur(20px);
      mix-blend-mode: screen;
    }

    .artifact.awakened .inner-light {
      animation: awaken-glow 2.4s ease-out both;
    }

    .artifact.awakened .object-image {
      animation:
        breathing 12s ease-in-out infinite,
        awaken-shudder 1.05s ease-out both;
    }

    @keyframes awaken-glow {
      0% {
        opacity: 0;
        transform: scale(.82);
      }
      18% {
        opacity: 1;
        transform: scale(1.08);
      }
      42% {
        opacity: .62;
        transform: scale(1);
      }
      100% {
        opacity: 0;
        transform: scale(.94);
      }
    }

    @keyframes awaken-shudder {
      0% {
        translate: 0 0;
        scale: 1;
        rotate: 0deg;
      }
      12% {
        translate: -1.5px 0;
        scale: 1.012;
        rotate: -.35deg;
      }
      25% {
        translate: 1.5px .5px;
        scale: 1.018;
        rotate: .3deg;
      }
      39% {
        translate: -.8px -.4px;
        scale: 1.012;
        rotate: -.18deg;
      }
      55% {
        translate: .5px 0;
        scale: 1.006;
        rotate: .1deg;
      }
      100% {
        translate: 0 0;
        scale: 1;
        rotate: 0deg;
      }
    }

    @keyframes breathing {
      0%, 100% {
        transform: scale(1) rotate(-.35deg);
      }
      50% {
        transform: scale(1.018) rotate(.35deg);
      }
    }

    @keyframes arrival {
      from {
        opacity: 0;
        transform: translateY(9px) scale(.975);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .grain {
      position: fixed;
      inset: -50%;
      width: 200%;
      height: 200%;
      pointer-events: none;
      z-index: 2;
      opacity: .12;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.48'/%3E%3C/svg%3E");
      animation: grainShift .24s steps(2) infinite;
    }

    @keyframes grainShift {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(1%, -1%); }
      50%  { transform: translate(-1%, 1%); }
      75%  { transform: translate(1%, 1%); }
      100% { transform: translate(-1%, -1%); }
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        transparent 35%,
        rgba(0, 0, 0, .16) 68%,
        rgba(0, 0, 0, .64) 120%
      );
    }

    @media (max-width: 600px) {
      .artifact {
        width: min(96vw, 540px);
        height: 78vh;
        height: 78dvh;
      }

      .light {
        width: 100vw;
      }

      .inner-light {
        filter: blur(14px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .grain,
      .artifact,
      .object-image {
        animation: none;
      }

      .artifact.awakened .inner-light {
        animation: awaken-glow 2.4s ease-out both;
      }
    }
  </style>
</head>

<body>
  <main class="room">
    <div class="light" aria-hidden="true"></div>

    <div class="artifact" id="artifact">
      <div class="object-image"></div>
      <div class="inner-light" aria-hidden="true"></div>
    </div>

    <div class="vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
  </main>

  <script>
    // Deter casual saving and dragging.
    document.addEventListener("contextmenu", function (event) {
      event.preventDefault();
    });

    document.addEventListener("dragstart", function (event) {
      event.preventDefault();
    });

    document.addEventListener("selectstart", function (event) {
      event.preventDefault();
    });

    // Block common save and view-source shortcuts where possible.
    document.addEventListener("keydown", function (event) {
      const key = event.key.toLowerCase();
      const modifier = event.ctrlKey || event.metaKey;

      if (modifier && ["s", "u"].includes(key)) {
        event.preventDefault();
      }
    });

    // Three taps/clicks awaken the object.
    const artifact = document.getElementById("artifact");
    let tapCount = 0;
    let tapTimer = null;
    let awakeTimer = null;

    artifact.addEventListener("pointerdown", function (event) {
      if (event.pointerType === "mouse" && event.button !== 0) {
        return;
      }

      tapCount += 1;

      clearTimeout(tapTimer);

      // Taps must happen within a short window.
      tapTimer = setTimeout(function () {
        tapCount = 0;
      }, 1400);

      if (tapCount >= 3) {
        tapCount = 0;
        clearTimeout(tapTimer);

        artifact.classList.remove("awakened");

        // Restart the effect if the visitor triggers it again.
        void artifact.offsetWidth;

        artifact.classList.add("awakened");

        clearTimeout(awakeTimer);
        awakeTimer = setTimeout(function () {
          artifact.classList.remove("awakened");
        }, 2500);
      }
    });
  </script>
</body>
</html>
