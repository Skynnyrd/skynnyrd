<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SKYNNYRD</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080808;
  color: #e8e5dd;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  cursor: none;
}

/* --------------------------------
   THE ROOM
-------------------------------- */

.room {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background:
    radial-gradient(
      ellipse at 50% 48%,
      #191919 0%,
      #0a0a0a 48%,
      #000 100%
    );
}

/* subtle texture */

.room::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: .08;

  background:
    repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 2px,
      white 3px
    );

  mix-blend-mode: overlay;
}

/* --------------------------------
   GIANT OBJECT
-------------------------------- */

.object {
  position: absolute;

  width: 62vw;
  height: 62vw;

  max-width: 760px;
  max-height: 760px;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%)
    rotate(-8deg);

  border-radius:
    47% 53% 48% 52% /
    55% 44% 56% 45%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #333 0%,
      #151515 35%,
      #050505 72%
    );

  box-shadow:
    inset -60px -80px 140px rgba(0,0,0,.9),
    inset 30px 30px 80px rgba(255,255,255,.025),
    0 0 120px rgba(0,0,0,.9);

  transition:
    transform 2s cubic-bezier(.2,.8,.2,1);
}

/* object moves with mouse */

.object::before {
  content: "";

  position: absolute;

  width: 32%;
  height: 32%;

  left: 28%;
  top: 24%;

  border-radius: 50%;

  background: #000;

  box-shadow:
    0 0 70px rgba(255,255,255,.025);
}

/* --------------------------------
   SKYNNYRD
-------------------------------- */

.name {
  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  font-size:
    clamp(48px, 10vw, 150px);

  font-weight: 700;

  letter-spacing:
    -.08em;

  color: #e8e5dd;

  mix-blend-mode: difference;

  user-select: none;

  z-index: 5;

  white-space: nowrap;
}

/* --------------------------------
   SMALL TEXT
-------------------------------- */

.fragment {
  position: absolute;

  font-family: monospace;

  font-size: 9px;

  letter-spacing: .12em;

  color: #aaa;

  opacity: .55;

  user-select: none;

  z-index: 10;
}

.f1 {
  left: 6vw;
  top: 9vh;
}

.f2 {
  right: 8vw;
  top: 18vh;
}

.f3 {
  left: 12vw;
  bottom: 18vh;
}

.f4 {
  right: 6vw;
  bottom: 9vh;
}

/* --------------------------------
   THE NUMBER
-------------------------------- */

.number {
  position: absolute;

  right: 14vw;
  bottom: 24vh;

  font-family: monospace;

  font-size: 14px;

  opacity: .7;

  z-index: 10;

  cursor: none;

  transition:
    opacity .4s,
    transform .4s;
}

.number:hover {
  opacity: 1;
  transform: scale(1.5);
}

/* --------------------------------
   RABBIT
-------------------------------- */

.rabbit {
  position: absolute;

  width: 110px;
  height: 150px;

  left: 18%;
  top: 55%;

  opacity: .45;

  z-index: 12;

  transition:
    transform 1.8s cubic-bezier(.2,.8,.2,1),
    opacity 1s;

  pointer-events: none;
}

.rabbit svg {
  width: 100%;
  height: 100%;
}

.rabbit path,
.rabbit circle {
  fill: none;
  stroke: #d9d6ce;
  stroke-width: 1;
}

.rabbit .eye {
  fill: #d9d6ce;
  stroke: none;
}

/* --------------------------------
   CURSOR
-------------------------------- */

.cursor {
  position: fixed;

  width: 14px;
  height: 14px;

  border:
    1px solid #fff;

  border-radius: 50%;

  pointer-events: none;

  transform:
    translate(-50%, -50%);

  z-index: 100;

  mix-blend-mode: difference;

  transition:
    width .2s,
    height .2s;
}

/* --------------------------------
   HIDDEN MESSAGE
-------------------------------- */

.message {
  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  font-family: monospace;

  font-size: 10px;

  letter-spacing: .3em;

  opacity: 0;

  pointer-events: none;

  z-index: 50;

  transition:
    opacity 1s;
}

.message.visible {
  opacity: 1;
}

/* --------------------------------
   SECOND ROOM
-------------------------------- */

.second {
  position: fixed;

  inset: 0;

  background: #e3dfd6;

  color: #111;

  opacity: 0;

  pointer-events: none;

  z-index: 200;

  transition:
    opacity 1.5s;
}

.second.active {
  opacity: 1;
  pointer-events: auto;
}

.second-word {
  position: absolute;

  left: 5vw;
  top: 8vh;

  font-size:
    clamp(50px, 12vw, 180px);

  letter-spacing:
    -.08em;

  line-height: .8;

  font-weight: 700;
}

.second-text {
  position: absolute;

  left: 7vw;
  bottom: 10vh;

  font-family: monospace;

  font-size: 10px;

  line-height: 1.7;
}

.close {
  position: absolute;

  right: 6vw;
  top: 6vh;

  font-family: monospace;

  font-size: 10px;

  cursor: pointer;

  opacity: .6;
}

.close:hover {
  opacity: 1;
}

</style>
</head>

<body>

<div class="room" id="room">

  <div class="object" id="object"></div>

  <div class="name">
    SKYNNYRD
  </div>

  <div class="fragment f1">
    peaceful visitors
  </div>

  <div class="fragment f2">
    something was here
  </div>

  <div class="fragment f3">
    do not explain
  </div>

  <div class="fragment f4">
    chasing rabbits
  </div>

  <div class="number" id="number">
    17
  </div>


  <div class="rabbit" id="rabbit">

    <svg viewBox="0 0 100 150">

      <path d="M40 60 C28 35 28 8 38 5 C48 3 48 34 50 53"/>
      <path d="M55 53 C58 30 65 4 75 7 C83 12 69 39 64 61"/>

      <path d="
        M35 58
        C40 45 60 45 68 58
        C77 73 66 88 52 91
        C38 92 29 76 35 58
      "/>

      <path d="
        M39 89
        C20 95 13 112 20 128
        C27 143 48 145 62 133
        C72 123 71 105 59 94
      "/>

      <circle cx="68" cy="112" r="9"/>

      <circle
        class="eye"
        cx="60"
        cy="63"
        r="2"
      />

    </svg>

  </div>


  <div class="cursor" id="cursor"></div>

  <div class="message" id="message">
    YOU WEREN'T SUPPOSED TO FIND THIS
  </div>

</div>


<!-- SECOND ROOM -->

<div class="second" id="second">

  <div class="second-word">
    ROOM<br>
    17
  </div>

  <div class="second-text">

    there was a door here.<br>
    there is still a door here.<br><br>

    nobody remembers opening it.

  </div>

  <div class="close" id="close">
    [ leave ]
  </div>

</div>


<script>

const object = document.getElementById("object");
const rabbit = document.getElementById("rabbit");
const cursor = document.getElementById("cursor");

const number = document.getElementById("number");

const message =
  document.getElementById("message");

const second =
  document.getElementById("second");

const close =
  document.getElementById("close");


/* -----------------------------
   CURSOR
----------------------------- */

document.addEventListener(
  "mousemove",
  function(e) {

    cursor.style.left =
      e.clientX + "px";

    cursor.style.top =
      e.clientY + "px";


    /* object reacts to visitor */

    const x =
      (e.clientX / window.innerWidth - .5);

    const y =
      (e.clientY / window.innerHeight - .5);


    object.style.transform =
      `
      translate(
        calc(-50% + ${x * 25}px),
        calc(-50% + ${y * 25}px)
      )
      rotate(${x * 4 - 8}deg)
      `;


    /* rabbit watches */

    rabbit.style.transform =
      `
      translate(
        ${x * 35}px,
        ${y * 20}px
      )
      `;

  }
);


/* -----------------------------
   NUMBER
----------------------------- */

number.addEventListener(
  "mouseenter",
  function() {

    message.classList.add("visible");

  }
);

number.addEventListener(
  "mouseleave",
  function() {

    message.classList.remove("visible");

  }
);


/* -----------------------------
   NUMBER CLICK
----------------------------- */

number.addEventListener(
  "click",
  function() {

    second.classList.add("active");

  }
);


/* -----------------------------
   CLOSE SECOND ROOM
----------------------------- */

close.addEventListener(
  "click",
  function() {

    second.classList.remove("active");

  }
);


/* -----------------------------
   RABBIT MOVES
----------------------------- */

setInterval(
  function() {

    const x =
      (Math.random() - .5) * 60;

    const y =
      (Math.random() - .5) * 40;

    rabbit.style.transform =
      `
      translate(${x}px, ${y}px)
      `;

  },
  4500
);


/* -----------------------------
   SECRET KEY
----------------------------- */

document.addEventListener(
  "keydown",
  function(e) {

    if (e.key.toLowerCase() === "r") {

      second.classList.add("active");

    }

  }
);

</script>

</body>
</html>
