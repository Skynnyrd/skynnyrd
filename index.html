 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0a">
<title>Peaceful Visitors Chasing Rabbits</title>

<style>
:root {
  color-scheme: dark;
  --black: #0b0b0a;
  --amber: #c58b48;
  --ivory: #b8a98c;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--black);
}

body {
  font-family: Georgia, "Times New Roman", serif;
  overscroll-behavior: none;
}

.room {
  position: fixed;
  inset: 0;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(ellipse at 50% 45%,
      #242119 0%, #171612 35%, #10100e 66%, #080808 100%);
  transition: background 4s ease;
}

.light {
  position: absolute;
  width: min(90vw, 850px);
  aspect-ratio: 1;
  left: 50%;
  top: 46%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(183, 135, 70, .075) 0%,
    rgba(143, 105, 55, .025) 35%,
    transparent 70%);
  pointer-events: none;
  transition: opacity 4s ease, transform 8s ease;
}

.artifact {
  position: absolute;
  z-index: 3;
  width: min(70vw, 480px);
  height: 88vh;
  height: 88dvh;
  left: 50%;
  top: 48%;
  transform: translate(-50%, -50%);
  display: grid;
  place-items: center;
  opacity: 0;
  animation: arrive 2.8s ease forwards;
  cursor: pointer;
  touch-action: manipulation;
  outline: none;
}

.object-image {
  width: 100%;
  height: 100%;
  background-image: url("object.png");
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;
  transform-origin: center;
  animation: breathing 12s ease-in-out infinite;
  will-change: transform;
  transition: opacity 3s ease, filter 3s ease;
}

.artifact:focus-visible {
  outline: 1px solid rgba(197, 139, 72, .4);
  outline-offset: 8px;
}

.grain {
  position: absolute;
  inset: -50%;
  z-index: 5;
  pointer-events: none;
  opacity: .12;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E");
  animation: grainShift .22s steps(2) infinite;
}

.vignette {
  position: absolute;
  inset: 0;
  z-index: 6;
  pointer-events: none;
  background: radial-gradient(ellipse at center,
    transparent 25%, rgba(0, 0, 0, .2) 65%, rgba(0, 0, 0, .7) 120%);
  transition: opacity 4s ease;
}

#world {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  opacity: 0;
  pointer-events: none;
  transition: opacity 5s ease;
}

.room.open {
  background:
    radial-gradient(ellipse at 50% 48%,
      #211b12 0%, #13120e 34%, #0b0b09 72%, #050505 100%);
}

.room.open .light {
  opacity: .75;
  transform: translate(-50%, -50%) scale(1.8);
}

.room.open #world {
  opacity: 1;
}

.room.open .object-image {
  opacity: .2;
  filter: brightness(.6) sepia(.25);
}

.room.open .artifact {
  z-index: 1;
  transform: translate(-50%, -50%) scale(.72);
  transition: transform 6s ease, opacity 5s ease;
}

.room.open .vignette {
  opacity: .55;
}

@keyframes arrive {
  from { opacity: 0; transform: translate(-50%, -47%); }
  to { opacity: 1; transform: translate(-50%, -50%); }
}

@keyframes breathing {
  0%, 100% { transform: scale(1.018) rotate(-.35deg); }
  50% { transform: scale(.99) rotate(.35deg); }
}

@keyframes grainShift {
  0% { transform: translate(0, 0); }
  25% { transform: translate(1%, -1%); }
  50% { transform: translate(-1%, 1%); }
  75% { transform: translate(1%, 1%); }
}

@media (max-width: 600px) {
  .artifact {
    width: min(96vw, 540px);
    height: 78vh;
    height: 78dvh;
    top: 47%;
  }

  .light {
    width: 100vw;
  }
}

@media (prefers-reduced-motion: reduce) {
  .grain, .object-image { animation: none; }
}
</style>
</head>

<body>
<main class="room" id="room">
  <div class="light"></div>

  <canvas id="world" aria-hidden="true"></canvas>

  <div class="artifact" id="artifact"
       role="button" tabindex="0"
       aria-label="Examine the object">
    <div class="object-image"></div>
  </div>

  <div class="grain"></div>
  <div class="vignette"></div>
</main>

<script>
(() => {
  const room = document.getElementById("room");
  const artifact = document.getElementById("artifact");
  const canvas = document.getElementById("world");
  const ctx = canvas.getContext("2d");

  let taps = 0;
  let opened = false;
  let width = 0;
  let height = 0;
  let dpr = 1;
  let startTime = 0;
  let branches = [];
  let nodes = [];
  let links = [];
  let raf = 0;

  const reducedMotion =
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function randomFactory(seed) {
    let s = seed >>> 0;
    return () => {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (opened) {
      createWorld();
      draw(performance.now());
    }
  }

  function createWorld() {
    branches = [];
    nodes = [];
    links = [];

    const rand = randomFactory(78193);
    const cx = width * (.5 + (rand() - .5) * .05);
    const cy = height * .49;
    const scale = Math.min(width, height);
    const reach = scale * .44;

    // A network that grows outward from the centre,
    // using related but deliberately imperfect angles.
    function grow(x, y, angle, length, depth, parentIndex, generation) {
      if (depth <= 0 || length < 5) return;

      const bend = (rand() - .5) * .48;
      const nextAngle = angle + bend;
      const endX = x + Math.cos(nextAngle) * length;
      const endY = y + Math.sin(nextAngle) * length;

      const index = branches.length;
      const thickness = Math.max(.45, depth * .64);

      branches.push({
        x1: x, y1: y,
        x2: endX, y2: endY,
        bend: bend,
        depth: depth,
        thickness: thickness,
        seed: rand() * Math.PI * 2,
        generation: generation
      });

      nodes.push({
        x: endX, y: endY,
        phase: rand() * Math.PI * 2,
        size: .5 + rand() * 1.6,
        depth: depth
      });

      if (parentIndex >= 0) {
        links.push({ a: parentIndex, b: index });
      }

      if (generation < 5) {
        const spread = .43 + rand() * .28;
        const nextLength = length * (.70 + rand() * .05);

        grow(endX, endY, nextAngle - spread, nextLength,
             depth - 1, index, generation + 1);

        grow(endX, endY, nextAngle + spread, nextLength,
             depth - 1, index, generation + 1);

        if (rand() > .66 && generation < 3) {
          grow(endX, endY, nextAngle + (rand() - .5) * .18,
               length * .64, depth - 1, index, generation + 1);
        }
      }
    }

    // Uneven radial growth creates an architectural,
    // almost skeletal structure rather than a perfect tree.
    const roots = 11;
    for (let i = 0; i < roots; i++) {
      const angle = (Math.PI * 2 * i / roots) +
                    (rand() - .5) * .24;
      const startX = cx + Math.cos(angle) * scale * .025;
      const startY = cy + Math.sin(angle) * scale * .025;
      grow(startX, startY, angle, reach * (.55 + rand() * .35),
           5, -1, 0);
    }

    // Connect nearby branches with faint mineral-like struts.
    // The connections follow distance, not a regular grid.
    for (let i = 0; i < nodes.length; i++) {
      let candidates = [];
      for (let j = i + 1; j < nodes.length; j++) {
        const dx = nodes[i].x - nodes[j].x;
        const dy = nodes[i].y - nodes[j].y;
        const dist = Math.hypot(dx, dy);
        if (dist > scale * .025 && dist < scale * .075) {
          candidates.push({ j, dist });
        }
      }

      candidates.sort((a, b) => a.dist - b.dist);
      if (candidates.length && rand() > .38) {
        const chosen = candidates[Math.floor(rand() *
          Math.min(candidates.length, 3))];
        links.push({ a: i, b: chosen.j, mineral: true });
      }
    }

    // Long, nearly invisible geometric relationships.
    // They become visible only as the world opens.
    for (let i = 0; i < nodes.length; i += 3) {
      let nearest = -1;
      let best = scale * .15;

      for (let j = i + 5; j < nodes.length; j += 2) {
        const d = Math.hypot(nodes[i].x - nodes[j].x,
                             nodes[i].y - nodes[j].y);
        if (d < best && d > scale * .045) {
          best = d;
          nearest = j;
        }
      }

      if (nearest >= 0 && rand() > .45) {
        links.push({ a: i, b: nearest, deep: true });
      }
    }
  }

  function line(x1, y1, x2, y2, color, thickness, alpha) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = color;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = thickness;
    ctx.stroke();
  }

  function draw(now) {
    if (!opened) return;

    const elapsed = (now - startTime) / 1000;
    const reveal = reducedMotion
      ? 1
      : Math.min(1, Math.max(0, elapsed / 8));

    ctx.clearRect(0, 0, width, height);
    ctx.save();

    // Slow spatial drift, like a room settling around you.
    const driftX = reducedMotion ? 0 : Math.sin(now * .00013) * 3;
    const driftY = reducedMotion ? 0 : Math.cos(now * .00011) * 4;
    ctx.translate(driftX, driftY);

    // Subtle distant geometry: fine lines, no interface.
    ctx.globalCompositeOperation = "source-over";
    for (const link of links) {
      if (!link.deep) continue;
      const a = nodes[link.a];
      const b = nodes[link.b];
      line(a.x, a.y, b.x, b.y,
        "rgba(158, 132, 91, 1)", .45, .075 * reveal);
    }

    // Branches are drawn from the centre outward.
    for (let i = 0; i < branches.length; i++) {
      const b = branches[i];
      const progress = reducedMotion
        ? 1
        : Math.min(1, Math.max(0,
            (elapsed - b.generation * .22) / 3.5));

      if (progress <= 0) continue;

      const ex = b.x1 + (b.x2 - b.x1) * progress;
      const ey = b.y1 + (b.y2 - b.y1) * progress;
      const midX = (b.x1 + ex) * .5;
      const midY = (b.y1 + ey) * .5;
      const offset = b.bend * 9;

      ctx.beginPath();
      ctx.moveTo(b.x1, b.y1);
      ctx.quadraticCurveTo(midX - offset, midY + offset, ex, ey);

      // Dark body: the structure should feel mineral, not neon.
      ctx.strokeStyle = "rgba(106, 91, 68, 1)";
      ctx.globalAlpha = .24 + reveal * .20;
      ctx.lineWidth = b.thickness + 2.5;
      ctx.stroke();

      // Narrow warm edge, like old stone catching light.
      ctx.strokeStyle = "rgba(190, 148, 91, 1)";
      ctx.globalAlpha = (.10 + reveal * .24) *
                        (b.depth / 5);
      ctx.lineWidth = Math.max(.35, b.thickness * .42);
      ctx.stroke();

      // A fine internal vein.
      ctx.strokeStyle = "rgba(226, 167, 89, 1)";
      ctx.globalAlpha = (.025 + reveal * .11) *
                        (b.depth / 5);
      ctx.lineWidth = .45;
      ctx.stroke();
    }

    // Irregular connections bind the branches into a larger system.
    for (const link of links) {
      if (link.deep) continue;

      const a = nodes[link.a];
      const b = nodes[link.b];
      const alpha = link.mineral ? .10 : .045;
      line(a.x, a.y, b.x, b.y,
        "rgba(184, 151, 102, 1)",
        link.mineral ? .65 : .4,
        alpha * reveal);
    }

    // Light travels through the system in slow pulses.
    ctx.globalCompositeOperation = "lighter";

    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      const pulse = reducedMotion
        ? .4
        : (Math.sin(now * .00065 + n.phase) + 1) / 2;

      const radius = n.size * (.65 + pulse * .65);
      const alpha = (.05 + pulse * .12) * reveal;

      if (alpha <= .01) continue;

      const glow = ctx.createRadialGradient(
        n.x, n.y, 0, n.x, n.y, radius * 5
      );
      glow.addColorStop(0, `rgba(238, 177, 98, ${alpha})`);
      glow.addColorStop(.3, `rgba(194, 131, 57, ${alpha * .35})`);
      glow.addColorStop(1, "rgba(194, 131, 57, 0)");

      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(n.x, n.y, radius * 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = `rgba(237, 189, 121, ${alpha * 1.6})`;
      ctx.beginPath();
      ctx.arc(n.x, n.y, radius * .55, 0, Math.PI * 2);
      ctx.fill();
    }

    // A faint central depth: a void, not a portal graphic.
    const cx = width * .5;
    const cy = height * .49;
    const core = ctx.createRadialGradient(
      cx, cy, 0, cx, cy, Math.min(width, height) * .22
    );
    core.addColorStop(0, "rgba(5, 5, 4, .48)");
    core.addColorStop(.5, "rgba(9, 8, 6, .14)");
    core.addColorStop(1, "rgba(9, 8, 6, 0)");

    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = core;
    ctx.fillRect(0, 0, width, height);

    ctx.restore();

    if (!reducedMotion) {
      raf = requestAnimationFrame(draw);
    }
  }

  function openWorld() {
    if (opened) return;
    opened = true;
    startTime = performance.now();

    createWorld();
    room.classList.add("open");

    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(draw);
  }

  function examine() {
    if (opened) return;
    taps++;

    // The first two touches leave no visible confirmation.
    if (taps >= 3) openWorld();
  }

  artifact.addEventListener("click", examine);

  artifact.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      examine();
    }
  });

  window.addEventListener("resize", resize, { passive: true });

  // Keep the original image from being dragged out of place.
  document.addEventListener("dragstart", event => event.preventDefault());

  resize();
})();
</script>
</body>
</html>
