
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0a">
  <title></title>

  <style>
    :root {
      color-scheme: dark;
      background: #0b0b0a;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: radial-gradient(
        ellipse at 50% 46%,
        #211f1a 0%,
        #121210 35%,
        #0b0b0a 75%
      );
      display: grid;
      place-items: center;
      -webkit-tap-highlight-color: transparent;
    }

    .room {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      display: grid;
      place-items: center;
      isolation: isolate;
      overflow: hidden;
    }

    .light {
      position: absolute;
      width: min(78vw, 780px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(154, 126, 83, 0.085) 0%,
        rgba(101, 83, 57, 0.035) 36%,
        transparent 70%
      );
      filter: blur(28px);
      pointer-events: none;
    }

    /* Desktop: constrain the object to the available height. */
    .artifact {
      position: relative;
      width: min(70vw, 480px);
      height: 88vh;
      height: 88dvh;
      display: grid;
      place-items: center;
      animation: arrival 2.8s ease-out both;
      will-change: transform;
    }

    .artifact img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      filter: contrast(1.035) saturate(.88) brightness(.91);
      animation: breathing 12s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes breathing {
      0%, 100% {
        transform: scale(1) rotate(-0.35deg);
      }
      50% {
        transform: scale(1.018) rotate(0.35deg);
      }
    }

    @keyframes arrival {
      from {
        opacity: 0;
        transform: translateY(9px) scale(.975);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .grain {
      position: fixed;
      inset: -50%;
      width: 200%;
      height: 200%;
      pointer-events: none;
      z-index: 2;
      opacity: .12;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.48'/%3E%3C/svg%3E");
      animation: grainShift .24s steps(2) infinite;
    }

    @keyframes grainShift {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(1%, -1%); }
      50%  { transform: translate(-1%, 1%); }
      75%  { transform: translate(1%, 1%); }
      100% { transform: translate(-1%, -1%); }
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        transparent 35%,
        rgba(0, 0, 0, .16) 68%,
        rgba(0, 0, 0, .64) 120%
      );
    }

    /* Keep the existing mobile appearance. */
    @media (max-width: 600px) {
      .artifact {
        width: min(96vw, 540px);
        height: 78vh;
        height: 78dvh;
      }

      .light {
        width: 100vw;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .grain,
      .artifact,
      .artifact img {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="room">
    <div class="light" aria-hidden="true"></div>

    <div class="artifact">
      <img src="object.png" alt="" draggable="false">
    </div>

    <div class="vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
  </main>
</body>
</html>
