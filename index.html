
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0a">

  <title>Peaceful Visitors Chasing Rabbits</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%230b0b0a'/%3E%3Cpath d='M34 9 C29 17 42 20 31 29 S23 42 34 54' fill='none' stroke='%23b18a55' stroke-width='2.1' stroke-linecap='round'/%3E%3Cpath d='M40 14 C47 23 30 29 39 37 S44 45 35 51' fill='none' stroke='%237a6447' stroke-width='1.1' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='31' r='2' fill='%23d7ae70' opacity='.8'/%3E%3C/svg%3E">

  <meta name="description" content="">

  <style>
    :root {
      color-scheme: dark;
      --amber: 183, 126, 57;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0b0b0a;
    }

    body {
      position: relative;
      isolation: isolate;
      background:
        radial-gradient(
          ellipse at 50% 44%,
          #211f1a 0%,
          #151411 36%,
          #0b0b0a 76%
        );
    }

    .atmosphere {
      position: fixed;
      inset: -15%;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at 50% 47%,
          rgba(var(--amber), 0.035) 0%,
          rgba(var(--amber), 0.012) 27%,
          transparent 58%
        );
      animation: atmosphere 13s ease-in-out infinite alternate;
    }

    .artifact {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(70vw, 480px);
      height: 88vh;
      height: 88dvh;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: arrival 2.8s ease both;
    }

    .living-surface {
      position: absolute;
      inset: 0;
      overflow: visible;
      transform-origin: 50% 50%;
      animation: breathing 11s ease-in-out infinite;
      will-change: transform;
    }

    .object-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-image: url("object.png");
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      transform-origin: 50% 50%;
      animation: slow-turn 17s ease-in-out infinite;
      will-change: filter, transform;
      filter: url(#living-distortion);
    }

    /* A soft, shifting warmth around the inner cavity. */
    .inner-light {
      position: absolute;
      width: 32%;
      aspect-ratio: 1;
      left: 50%;
      top: 47%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(
        circle,
        rgba(218, 150, 66, 0.105) 0%,
        rgba(184, 112, 40, 0.065) 23%,
        rgba(156, 93, 35, 0.025) 48%,
        transparent 72%
      );
      mix-blend-mode: screen;
      filter: blur(9px);
      animation: ember 7.3s ease-in-out infinite;
    }

    .grain {
      position: fixed;
      inset: -50%;
      width: 200%;
      height: 200%;
      z-index: 4;
      pointer-events: none;
      opacity: 0.105;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.24'/%3E%3C/svg%3E");
      animation: grain-shift 0.24s steps(2) infinite;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        transparent 35%,
        rgba(0, 0, 0, 0.15) 70%,
        rgba(0, 0, 0, 0.48) 115%
      );
    }

    @keyframes arrival {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes breathing {
      0%, 100% {
        transform: scale(1) rotate(0deg);
      }
      28% {
        transform: scale(1.006, 1.009) rotate(-0.12deg);
      }
      61% {
        transform: scale(1.012, 1.004) rotate(0.1deg);
      }
      79% {
        transform: scale(1.004, 1.01) rotate(-0.06deg);
      }
    }

    @keyframes slow-turn {
      0%, 100% {
        transform: scale(1) rotate(0deg);
      }
      38% {
        transform: scale(1.005) rotate(0.12deg);
      }
      73% {
        transform: scale(1.009) rotate(-0.1deg);
      }
    }

    @keyframes ember {
      0%, 100% {
        opacity: 0.48;
        transform: translate(-50%, -50%) scale(0.88);
      }
      24% {
        opacity: 0.75;
        transform: translate(-50%, -50%) scale(1.02);
      }
      51% {
        opacity: 0.56;
        transform: translate(-50%, -50%) scale(0.94);
      }
      68% {
        opacity: 0.83;
        transform: translate(-50%, -50%) scale(1.08);
      }
      86% {
        opacity: 0.44;
        transform: translate(-50%, -50%) scale(0.91);
      }
    }

    @keyframes atmosphere {
      from {
        opacity: 0.65;
        transform: scale(0.98);
      }
      to {
        opacity: 1;
        transform: scale(1.035);
      }
    }

    @keyframes grain-shift {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(1%, -1%); }
      50%  { transform: translate(-1%, 1%); }
      75%  { transform: translate(1%, 1%); }
      100% { transform: translate(-1%, -1%); }
    }

    @media (max-width: 600px) {
      .artifact {
        width: min(96vw, 540px);
        height: 78vh;
        height: 78dvh;
      }

      .inner-light {
        width: 34%;
        filter: blur(7px);
      }

      .grain {
        opacity: 0.075;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .living-surface,
      .object-image,
      .inner-light,
      .atmosphere,
      .grain {
        animation: none;
      }

      .object-image {
        filter: none;
      }
    }
  </style>
</head>

<body>
  <!-- Animated organic distortion -->
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="0"
    height="0"
    aria-hidden="true"
    style="position:absolute"
  >
    <filter id="living-distortion" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence
        id="surface-noise"
        type="fractalNoise"
        baseFrequency="0.012 0.018"
        numOctaves="2"
        seed="8"
        result="noise"
      >
        <animate
          attributeName="baseFrequency"
          dur="13s"
          values="0.012 0.018;0.016 0.012;0.01 0.02;0.014 0.015;0.012 0.018"
          keyTimes="0;0.27;0.53;0.79;1"
          repeatCount="indefinite"
        />
      </feTurbulence>
      <feDisplacementMap
        in="SourceGraphic"
        in2="noise"
        scale="2.2"
        xChannelSelector="R"
        yChannelSelector="G"
      >
        <animate
          attributeName="scale"
          dur="9.5s"
          values="1.2;2.5;1.5;3;1.2"
          keyTimes="0;0.29;0.55;0.78;1"
          repeatCount="indefinite"
        />
      </feDisplacementMap>
    </filter>
  </svg>

  <div class="atmosphere"></div>

  <main class="artifact" aria-label=" ">
    <div class="living-surface">
      <div class="object-image" role="img" aria-label="An abstract sculptural form"></div>
      <div class="inner-light"></div>
    </div>
  </main>

  <div class="vignette"></div>
  <div class="grain"></div>

  <script>
    // Discourage casual saving and dragging of the displayed artwork.
    document.addEventListener("contextmenu", event => {
      event.preventDefault();
    });

    document.addEventListener("dragstart", event => {
      event.preventDefault();
    });

    document.addEventListener("selectstart", event => {
      event.preventDefault();
    });

    // Keep the distortion subtle and irregular.
    // If SVG filter animation is unsupported, the CSS breathing remains.
    const surface = document.querySelector(".living-surface");
    const image = document.querySelector(".object-image");

    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      surface.style.animation = "none";
      image.style.animation = "none";
      document.querySelector(".inner-light").style.animation = "none";
      document.querySelector(".atmosphere").style.animation = "none";
      document.querySelector(".grain").style.animation = "none";
    }
  </script>
</body>
</html>
