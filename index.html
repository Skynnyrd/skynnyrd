<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKYNNYRD</title>

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
  }

  body {
    cursor: none;
    font-family: Arial, Helvetica, sans-serif;
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .label {
    position: fixed;
    left: 50%;
    bottom: 4vh;
    transform: translateX(-50%);
    color: rgba(255,255,255,.35);
    font-family: monospace;
    font-size: 9px;
    letter-spacing: .35em;
    user-select: none;
    pointer-events: none;
    transition: opacity 1s;
  }

  .title {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    color: white;
    font-size: clamp(45px, 10vw, 150px);
    font-weight: 700;
    letter-spacing: -.08em;
    pointer-events: none;
    user-select: none;
    opacity: 0;
    mix-blend-mode: difference;
    transition: opacity 2s;
  }

  .cursor {
    position: fixed;
    width: 18px;
    height: 18px;
    border: 1px solid rgba(255,255,255,.8);
    border-radius: 50%;
    transform: translate(-50%,-50%);
    pointer-events: none;
    z-index: 20;
    mix-blend-mode: difference;
    transition:
      width .2s,
      height .2s;
  }

  .found {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    color: white;
    font-family: monospace;
    font-size: 10px;
    letter-spacing: .4em;
    opacity: 0;
    pointer-events: none;
    z-index: 10;
    transition: opacity 1s;
  }

  .found.visible {
    opacity: 1;
  }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="cursor" id="cursor"></div>

<div class="title" id="title">
  SKYNNYRD
</div>

<div class="found" id="found">
  YOU FOUND IT
</div>

<div class="label" id="label">
  TOUCH IT
</div>

<script>

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const cursor =
  document.getElementById("cursor");

const title =
  document.getElementById("title");

const found =
  document.getElementById("found");

const label =
  document.getElementById("label");


let width;
let height;

let mouse = {
  x: -1000,
  y: -1000,
  down: false
};

let particles = [];

let revealed = false;


/* --------------------------------
   RESIZE
-------------------------------- */

function resize() {

  width =
    canvas.width =
      window.innerWidth *
      devicePixelRatio;

  height =
    canvas.height =
      window.innerHeight *
      devicePixelRatio;

  canvas.style.width =
    window.innerWidth + "px";

  canvas.style.height =
    window.innerHeight + "px";

  ctx.setTransform(
    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0
  );
}

resize();

window.addEventListener(
  "resize",
  resize
);


/* --------------------------------
   CREATE PARTICLES
-------------------------------- */

function createParticles() {

  particles = [];

  const cx =
    window.innerWidth / 2;

  const cy =
    window.innerHeight / 2;

  const radius =
    Math.min(
      window.innerWidth,
      window.innerHeight
    ) * .34;

  const count = 900;

  for (
    let i = 0;
    i < count;
    i++
  ) {

    const angle =
      Math.random() *
      Math.PI * 2;

    const distance =
      Math.pow(
        Math.random(),
        .55
      ) * radius;

    const x =
      cx +
      Math.cos(angle) *
      distance;

    const y =
      cy +
      Math.sin(angle) *
      distance;

    particles.push({

      x: x,
      y: y,

      ox: x,
      oy: y,

      vx: 0,
      vy: 0,

      size:
        Math.random() *
        1.8 + .3,

      phase:
        Math.random() *
        Math.PI * 2

    });

  }
}

createParticles();


/* --------------------------------
   MOUSE
-------------------------------- */

window.addEventListener(
  "mousemove",
  function(e) {

    mouse.x = e.clientX;
    mouse.y = e.clientY;

    cursor.style.left =
      mouse.x + "px";

    cursor.style.top =
      mouse.y + "px";

  }
);

window.addEventListener(
  "mousedown",
  function() {

    mouse.down = true;

    cursor.style.width = "34px";
    cursor.style.height = "34px";

  }
);

window.addEventListener(
  "mouseup",
  function() {

    mouse.down = false;

    cursor.style.width = "18px";
    cursor.style.height = "18px";

  }
);


/* --------------------------------
   THE HIDDEN OBJECT
-------------------------------- */

const secretX =
  window.innerWidth / 2 + 80;

const secretY =
  window.innerHeight / 2 - 40;


/* --------------------------------
   ANIMATION
-------------------------------- */

function animate(time) {

  const t =
    time * .001;

  ctx.clearRect(
    0,
    0,
    window.innerWidth,
    window.innerHeight
  );


  const cx =
    window.innerWidth / 2;

  const cy =
    window.innerHeight / 2;


  /* dark breathing background */

  const glow =
    ctx.createRadialGradient(
      cx,
      cy,
      0,
      cx,
      cy,
      Math.min(
        window.innerWidth,
        window.innerHeight
      ) * .55
    );

  glow.addColorStop(
    0,
    "rgba(255,255,255,.035)"
  );

  glow.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );

  ctx.fillStyle =
    glow;

  ctx.fillRect(
    0,
    0,
    window.innerWidth,
    window.innerHeight
  );


  /* particles */

  for (
    let i = 0;
    i < particles.length;
    i++
  ) {

    const p =
      particles[i];


    /*
      organic breathing
    */

    const breathing =
      Math.sin(
        t * .7 +
        p.phase
      ) * .25;


    const targetX =
      p.ox +
      Math.cos(
        p.phase + t * .2
      ) * breathing;

    const targetY =
      p.oy +
      Math.sin(
        p.phase + t * .2
      ) * breathing;


    /*
      mouse force
    */

    const dx =
      p.x - mouse.x;

    const dy =
      p.y - mouse.y;

    const distance =
      Math.sqrt(
        dx * dx +
        dy * dy
      );


    const influence = 150;


    if (distance < influence) {

      const force =
        (1 -
          distance /
          influence);

      const angle =
        Math.atan2(
          dy,
          dx
        );

      p.vx +=
        Math.cos(angle) *
        force *
        (mouse.down ? 2.8 : .9);

      p.vy +=
        Math.sin(angle) *
        force *
        (mouse.down ? 2.8 : .9);

    }


    /*
      return to origin
    */

    p.vx +=
      (targetX - p.x) *
      .002;

    p.vy +=
      (targetY - p.y) *
      .002;


    p.vx *= .94;
    p.vy *= .94;


    p.x += p.vx;
    p.y += p.vy;


    /*
      draw
    */

    const alpha =
      .18 +
      Math.sin(
        t +
        p.phase
      ) * .12;


    ctx.fillStyle =
      `rgba(255,255,255,${alpha})`;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI * 2
    );

    ctx.fill();

  }


  /*
    Hidden structure.

    Very faint lines connect
    nearby particles.
  */

  for (
    let i = 0;
    i < particles.length;
    i += 3
  ) {

    const p =
      particles[i];

    const dx =
      p.x - cx;

    const dy =
      p.y - cy;

    const distance =
      Math.sqrt(
        dx * dx +
        dy * dy
      );


    if (distance < 170) {

      ctx.strokeStyle =
        "rgba(255,255,255,.025)";

      ctx.beginPath();

      ctx.moveTo(
        p.x,
        p.y
      );

      ctx.lineTo(
        cx,
        cy
      );

      ctx.stroke();

    }

  }


  /*
    Check whether visitor
    has discovered the center.
  */

  const centerDistance =
    Math.sqrt(
      Math.pow(
        mouse.x - cx,
        2
      ) +
      Math.pow(
        mouse.y - cy,
        2
      )
    );


  if (
    centerDistance < 45 &&
    mouse.down &&
    !revealed
  ) {

    reveal();

  }


  requestAnimationFrame(
    animate
  );
}

animate(0);


/* --------------------------------
   REVEAL
-------------------------------- */

function reveal() {

  revealed = true;

  title.style.opacity =
    "1";

  found.classList.add(
    "visible"
  );

  label.style.opacity =
    "0";

  setTimeout(
    function() {

      found.classList.remove(
        "visible"
      );

    },
    2200
  );

  setTimeout(
    function() {

      title.style.opacity =
        ".15";

      label.textContent =
        "KEEP GOING";

      label.style.opacity =
        ".35";

    },
    2500
  );

}


/* --------------------------------
   RANDOM DISTURBANCES
-------------------------------- */

setInterval(
  function() {

    const p =
      particles[
        Math.floor(
          Math.random() *
          particles.length
        )
      ];

    p.vx +=
      (Math.random() - .5) *
      8;

    p.vy +=
      (Math.random() - .5) *
      8;

  },
  1800
);

</script>

</body>
</html>
