<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKYNNYRD</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #050505;
      overflow: hidden;
    }

    body {
      color: #f2f2f2;
      font-family: Arial, Helvetica, sans-serif;
      cursor: crosshair;
    }

    .world {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .core {
      text-align: center;
      transition: transform 1.4s cubic-bezier(.2,.8,.2,1);
      user-select: none;
    }

    .name {
      font-size: clamp(30px, 6vw, 72px);
      font-weight: 400;
      letter-spacing: .18em;
      margin-left: .18em;
    }

    .motto {
      margin-top: 18px;
      font-size: 9px;
      letter-spacing: .28em;
      opacity: .28;
      margin-left: .28em;
    }

    .day {
      margin-top: 22px;
      font-size: 10px;
      letter-spacing: .5em;
      margin-left: .5em;
      opacity: .4;
    }

    .visitor {
      position: fixed;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: white;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1s ease, transform 1.5s ease;
    }

    .whisper {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 7px;
      letter-spacing: .4em;
      opacity: 0;
      transition: opacity 2s ease;
    }

    body:hover .whisper {
      opacity: .12;
    }
  </style>
</head>

<body>

  <div class="world">

    <div class="core" id="core">
      <div class="name">SKYNNYRD</div>
      <div class="motto">peaceful visitors chasing rabbits</div>
      <div class="day">01</div>
    </div>

  </div>

  <div class="visitor" id="visitor"></div>

  <div class="whisper">COME BACK</div>

  <script>
    const core = document.getElementById("core");
    const visitor = document.getElementById("visitor");

    document.addEventListener("mousemove", function(event) {

      const x = (event.clientX / window.innerWidth - 0.5) * 2;
      const y = (event.clientY / window.innerHeight - 0.5) * 2;

      core.style.transform =
        `translate(${x * 7}px, ${y * 7}px)`;

      if (Math.random() < 0.02) {

        visitor.style.left = event.clientX + "px";
        visitor.style.top = event.clientY + "px";

        visitor.style.opacity = ".35";

        visitor.style.transform =
          `scale(${1 + Math.random() * 5})`;

        setTimeout(function() {
          visitor.style.opacity = "0";
        }, 500);
      }
    });

    document.addEventListener("mouseleave", function() {
      core.style.transform = "translate(0,0)";
    });
  </script>

</body>
</html>
