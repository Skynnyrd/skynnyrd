
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0a">
  <title>PVCR</title>

  <style>
    :root {
      color-scheme: dark;
      background: #0b0b0a;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: radial-gradient(
        ellipse at 50% 46%,
        #211f1a 0%,
        #121210 35%,
        #0b0b0a 75%
      );
      display: grid;
      place-items: center;
      user-select: none;
      -webkit-user-select: none;
    }

    .room {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: grid;
      place-items: center;
      isolation: isolate;
      overflow: hidden;
    }

    .light {
      position: absolute;
      width: min(78vw, 780px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(154, 126, 83, .085) 0%,
        rgba(101, 83, 57, .035) 36%,
        transparent 70%
      );
      filter: blur(28px);
      pointer-events: none;
    }

    .artifact {
      position: relative;
      width: min(70vw, 480px);
      height: 88vh;
      height: 88dvh;
      display: grid;
      place-items: center;
      cursor: pointer;
      outline: none;
      animation: arrival 2.8s ease-out both;
      will-change: transform;
    }

    .object-image {
      width: 100%;
      height: 100%;
      background-image: url("object.png");
      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      animation: breathing 12s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes breathing {
      0%, 100% {
        transform: scale(1) rotate(-.35deg);
      }
      50% {
        transform: scale(1.018) rotate(.35deg);
      }
    }

    @keyframes arrival {
      from {
        opacity: 0;
        transform: translateY(9px) scale(.975);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .grain {
      position: fixed;
      inset: -50%;
      width: 200%;
      height: 200%;
      pointer-events: none;
      z-index: 5;
      opacity: .12;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.48'/%3E%3C/svg%3E");
      animation: grainShift .24s steps(2) infinite;
    }

    @keyframes grainShift {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(1%, -1%); }
      50%  { transform: translate(-1%, 1%); }
      75%  { transform: translate(1%, 1%); }
      100% { transform: translate(-1%, -1%); }
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        transparent 35%,
        rgba(0, 0, 0, .16) 68%,
        rgba(0, 0, 0, .64) 120%
      );
    }

    /* Second screen: a separate space, not a transition effect. */

    .other-reality {
      position: fixed;
      inset: 0;
      z-index: 3;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      overflow: hidden;
      background:
        radial-gradient(
          ellipse at 48% 52%,
          #171611 0%,
          #090908 34%,
          #030303 76%
        );
    }

    body.taken-over .room {
      visibility: hidden;
    }

    body.taken-over .other-reality {
      visibility: visible;
      opacity: 1;
    }

    @media (max-width: 600px) {
      .artifact {
        width: min(96vw, 540px);
        height: 78vh;
        height: 78dvh;
      }

      .light {
        width: 100vw;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .grain,
      .artifact,
      .object-image {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="room">
    <div class="light" aria-hidden="true"></div>

    <div
      class="artifact"
      id="artifact"
      role="button"
      tabindex="0"
      aria-label="Interact with the object"
    >
      <div class="object-image"></div>
    </div>

    <div class="vignette" aria-hidden="true"></div>
  </main>

  <section class="other-reality" aria-hidden="true"></section>

  <div class="grain" aria-hidden="true"></div>

  <script>
    const artifact = document.getElementById("artifact");

    let taps = 0;
    let resetTimer;

    function registerTap() {
      if (document.body.classList.contains("taken-over")) return;

      taps++;
      clearTimeout(resetTimer);

      if (taps >= 3) {
        document.body.classList.add("taken-over");
        return;
      }

      resetTimer = setTimeout(() => {
        taps = 0;
      }, 1000);
    }

    artifact.addEventListener("click", registerTap);

    artifact.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        registerTap();
      }
    });

    document.addEventListener("contextmenu", (event) => {
      event.preventDefault();
    });

    document.addEventListener("dragstart", (event) => {
      event.preventDefault();
    });

    document.addEventListener("selectstart", (event) => {
      event.preventDefault();
    });

    document.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      const modifier = event.ctrlKey || event.metaKey;

      if (modifier && ["s", "u"].includes(key)) {
        event.preventDefault();
      }
    });
  </script>
</body>
</html>
