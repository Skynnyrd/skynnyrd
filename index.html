<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title></title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0a0908;
}

body {
  touch-action: none;
  cursor: none;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

.cursor {
  position: fixed;
  width: 12px;
  height: 12px;
  border: 1px solid rgba(238,234,222,.38);
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%, -50%);
  z-index: 10;
  mix-blend-mode: difference;
}

@media (pointer: coarse) {
  .cursor {
    display: none;
  }
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>
<div class="cursor" id="cursor"></div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const cursor = document.getElementById("cursor");

let W = 0;
let H = 0;
let DPR = 1;
let time = 0;


/* ---------------------------------------
   POINTER
--------------------------------------- */

const pointer = {
  x: -1000,
  y: -1000,
  active: false,
  down: false
};


/* ---------------------------------------
   THE ENVIRONMENT
--------------------------------------- */

let dust = [];
let grass = [];
let stones = [];

const DUST_COUNT = 180;
const GRASS_COUNT = 95;
const STONE_COUNT = 28;


/* ---------------------------------------
   THE VISITOR
--------------------------------------- */

const visitor = {
  x: 0,
  y: 0,

  targetX: 0,
  targetY: 0,

  vx: 0,
  vy: 0,

  visible: 0,

  phase: Math.random() * Math.PI * 2,

  fleeing: false,
  fleeTimer: 0,

  nextMove: 0
};


/* ---------------------------------------
   RESIZE
--------------------------------------- */

function resize() {

  W = window.innerWidth;
  H = window.innerHeight;

  DPR = Math.min(
    window.devicePixelRatio || 1,
    2
  );

  canvas.width = W * DPR;
  canvas.height = H * DPR;

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );

  createWorld();
}

window.addEventListener("resize", resize);


/* ---------------------------------------
   WORLD CREATION
--------------------------------------- */

function createWorld() {

  dust = [];
  grass = [];
  stones = [];

  /*
    Dust / tiny suspended particles.
    Very sparse.
  */

  for (let i = 0; i < DUST_COUNT; i++) {

    dust.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: .2 + Math.random() * .7,
      alpha: .025 + Math.random() * .09,
      drift: .08 + Math.random() * .22,
      phase: Math.random() * Math.PI * 2
    });
  }


  /*
    Quiet grass-like marks around
    the lower environment.
  */

  for (let i = 0; i < GRASS_COUNT; i++) {

    grass.push({
      x: Math.random() * W,
      y: H * (.67 + Math.random() * .29),
      length: 4 + Math.random() * 15,
      lean: -1 + Math.random() * 2,
      alpha: .035 + Math.random() * .08,
      phase: Math.random() * Math.PI * 2
    });
  }


  /*
    Almost invisible stones.
  */

  for (let i = 0; i < STONE_COUNT; i++) {

    stones.push({
      x: Math.random() * W,
      y: H * (.72 + Math.random() * .23),
      rx: 3 + Math.random() * 13,
      ry: 1.5 + Math.random() * 5,
      alpha: .025 + Math.random() * .065,
      rotation: Math.random() * Math.PI
    });
  }


  /*
    Put the visitor somewhere different
    every time the world is created.
  */

  visitor.x = W * (.25 + Math.random() * .5);
  visitor.y = H * (.40 + Math.random() * .30);

  visitor.targetX = visitor.x;
  visitor.targetY = visitor.y;

  visitor.visible = 0;
  visitor.fleeing = false;
  visitor.fleeTimer = 0;

  chooseNewDestination();
}


/* ---------------------------------------
   VISITOR MOVEMENT
--------------------------------------- */

function chooseNewDestination() {

  /*
    The visitor prefers the quieter
    edges of the environment.
  */

  const edge = Math.random();

  if (edge < .5) {

    visitor.targetX =
      W * (.12 + Math.random() * .76);

    visitor.targetY =
      H * (.48 + Math.random() * .38);

  } else {

    visitor.targetX =
      W * (.08 + Math.random() * .84);

    visitor.targetY =
      H * (.58 + Math.random() * .25);
  }

  visitor.nextMove =
    time +
    1800 +
    Math.random() * 5000;
}


/* ---------------------------------------
   INPUT
--------------------------------------- */

function movePointer(x, y) {

  pointer.x = x;
  pointer.y = y;
  pointer.active = true;

  cursor.style.left = x + "px";
  cursor.style.top = y + "px";
}

window.addEventListener("mousemove", e => {

  movePointer(
    e.clientX,
    e.clientY
  );
});


window.addEventListener("mousedown", () => {

  pointer.down = true;
});


window.addEventListener("mouseup", () => {

  pointer.down = false;
});


window.addEventListener(
  "touchstart",
  e => {

    const touch = e.touches[0];

    movePointer(
      touch.clientX,
      touch.clientY
    );

    pointer.down = true;

  },
  { passive: false }
);


window.addEventListener(
  "touchmove",
  e => {

    e.preventDefault();

    const touch = e.touches[0];

    movePointer(
      touch.clientX,
      touch.clientY
    );

  },
  { passive: false }
);


window.addEventListener(
  "touchend",
  () => {

    pointer.down = false;

  }
);


/* ---------------------------------------
   VISITOR / HUMAN PROXIMITY
--------------------------------------- */

function checkVisitorProximity() {

  if (!pointer.active) return;

  const dx =
    visitor.x -
    pointer.x;

  const dy =
    visitor.y -
    pointer.y;

  const distance =
    Math.sqrt(dx * dx + dy * dy);


  /*
    The visitor notices you.
  */

  if (
    distance < 155 &&
    !visitor.fleeing
  ) {

    visitor.fleeing = true;
    visitor.fleeTimer = time;

    /*
      Run away from the pointer.
    */

    const angle =
      Math.atan2(dy, dx);

    visitor.vx +=
      Math.cos(angle) * 5;

    visitor.vy +=
      Math.sin(angle) * 5;
  }
}


/* ---------------------------------------
   UPDATE VISITOR
--------------------------------------- */

function updateVisitor() {

  checkVisitorProximity();


  if (visitor.fleeing) {

    /*
      Strong movement immediately after
      being approached.
    */

    visitor.vx *= .975;
    visitor.vy *= .975;

    visitor.x += visitor.vx;
    visitor.y += visitor.vy;

    /*
      Slowly become calm again.
    */

    if (
      time -
      visitor.fleeTimer >
      1300
    ) {

      visitor.fleeing = false;

      chooseNewDestination();
    }

  } else {

    /*
      Quiet wandering.
    */

    if (time > visitor.nextMove) {

      chooseNewDestination();
    }

    const dx =
      visitor.targetX -
      visitor.x;

    const dy =
      visitor.targetY -
      visitor.y;

    visitor.vx += dx * .0008;
    visitor.vy += dy * .0008;

    visitor.vx *= .965;
    visitor.vy *= .965;

    visitor.x += visitor.vx;
    visitor.y += visitor.vy;
  }


  /*
    The visitor should never completely
    leave the environment.
  */

  visitor.x =
    Math.max(
      W * .05,
      Math.min(
        W * .95,
        visitor.x
      )
    );

  visitor.y =
    Math.max(
      H * .32,
      Math.min(
        H * .92,
        visitor.y
      )
    );


  /*
    It is rarely visible.

    Most of the time you're not supposed
    to know whether you actually saw it.
  */

  const breathing =
    Math.sin(
      time * .0013 +
      visitor.phase
    );

  const desiredVisibility =
    visitor.fleeing
      ? .82
      : .16 + breathing * .055;

  visitor.visible +=
    (desiredVisibility -
      visitor.visible) *
    .018;
}


/* ---------------------------------------
   DRAW BACKGROUND
--------------------------------------- */

function drawBackground() {

  ctx.fillStyle = "#0a0908";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /*
    Very subtle warm atmospheric field.
  */

  const gradient =
    ctx.createRadialGradient(
      W * .5,
      H * .54,
      0,
      W * .5,
      H * .54,
      Math.max(W,H) * .72
    );

  gradient.addColorStop(
    0,
    "rgba(102,94,77,.055)"
  );

  gradient.addColorStop(
    .48,
    "rgba(54,49,41,.025)"
  );

  gradient.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );

  ctx.fillStyle = gradient;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /*
    Barely visible horizon.
  */

  const horizon =
    H * .67;

  const horizonGradient =
    ctx.createLinearGradient(
      0,
      horizon - 80,
      0,
      horizon + 100
    );

  horizonGradient.addColorStop(
    0,
    "rgba(180,170,148,0)"
  );

  horizonGradient.addColorStop(
    .55,
    "rgba(180,170,148,.025)"
  );

  horizonGradient.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );

  ctx.fillStyle =
    horizonGradient;

  ctx.fillRect(
    0,
    horizon - 80,
    W,
    180
  );
}


/* ---------------------------------------
   DRAW DUST
--------------------------------------- */

function drawDust() {

  for (const d of dust) {

    d.y -= d.drift * .018;

    d.x +=
      Math.sin(
        time * .00015 +
        d.phase
      ) * .025;

    if (d.y < -5) {
      d.y = H + 5;
    }

    ctx.fillStyle =
      `rgba(
        220,
        215,
        201,
        ${d.alpha}
      )`;

    ctx.beginPath();

    ctx.arc(
      d.x,
      d.y,
      d.size,
      0,
      Math.PI * 2
    );

    ctx.fill();
  }
}


/* ---------------------------------------
   DRAW GROUND
--------------------------------------- */

function drawGround() {

  /*
    Grass marks.
  */

  for (const g of grass) {

    const sway =
      Math.sin(
        time * .0008 +
        g.phase
      ) * 1.8;

    ctx.strokeStyle =
      `rgba(
        205,
        199,
        182,
        ${g.alpha}
      )`;

    ctx.lineWidth = .45;

    ctx.beginPath();

    ctx.moveTo(
      g.x,
      g.y
    );

    ctx.lineTo(
      g.x +
      g.lean +
      sway,
      g.y -
      g.length
    );

    ctx.stroke();
  }


  /*
    Stones.
  */

  for (const s of stones) {

    ctx.save();

    ctx.translate(
      s.x,
      s.y
    );

    ctx.rotate(
      s.rotation
    );

    ctx.fillStyle =
      `rgba(
        185,
        179,
        164,
        ${s.alpha}
      )`;

    ctx.beginPath();

    ctx.ellipse(
      0,
      0,
      s.rx,
      s.ry,
      0,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.restore();
  }
}


/* ---------------------------------------
   DRAW VISITOR
--------------------------------------- */

function drawVisitor() {

  /*
    The visitor is deliberately ambiguous.

    It is NOT a rabbit illustration.

    It is a small moving silhouette made
    from soft overlapping forms.
  */

  const x = visitor.x;
  const y = visitor.y;

  const scale =
    Math.min(W,H) * .012;


  /*
    Shadow / contact.
  */

  ctx.save();

  ctx.translate(
    x,
    y
  );


  /*
    Body.
  */

  ctx.fillStyle =
    `rgba(
      225,
      220,
      207,
      ${visitor.visible * .52}
    )`;

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    scale * 1.8,
    scale * .8,
    -.08,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /*
    Head.
  */

  ctx.beginPath();

  ctx.ellipse(
    scale * 1.35,
    -scale * .35,
    scale * .72,
    scale * .62,
    -.18,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /*
    Two extremely subtle vertical
    shapes suggest ears without
    becoming an obvious rabbit.
  */

  ctx.fillStyle =
    `rgba(
      225,
      220,
      207,
      ${visitor.visible * .40}
    )`;

  ctx.beginPath();

  ctx.ellipse(
    scale * 1.15,
    -scale * 1.05,
    scale * .20,
    scale * .72,
    -.16,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.beginPath();

  ctx.ellipse(
    scale * 1.62,
    -scale * .96,
    scale * .18,
    scale * .66,
    .12,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /*
    Soft contact shadow.
  */

  ctx.fillStyle =
    `rgba(
      0,
      0,
      0,
      ${visitor.visible * .25}
    )`;

  ctx.beginPath();

  ctx.ellipse(
    0,
    scale * .68,
    scale * 2.3,
    scale * .32,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.restore();
}


/* ---------------------------------------
   RARE MOVEMENT TRACE
--------------------------------------- */

function drawTrace() {

  /*
    When the visitor moves quickly,
    a tiny ghost of its previous position
    remains for a fraction of a second.
  */

  if (!visitor.fleeing) return;

  const speed =
    Math.sqrt(
      visitor.vx * visitor.vx +
      visitor.vy * visitor.vy
    );

  if (speed < 1.2) return;

  const angle =
    Math.atan2(
      visitor.vy,
      visitor.vx
    );

  const length =
    Math.min(
      speed * 2.8,
      32
    );

  ctx.strokeStyle =
    `rgba(
      225,
      220,
      207,
      ${visitor.visible * .12}
    )`;

  ctx.lineWidth = .6;

  ctx.beginPath();

  ctx.moveTo(
    visitor.x -
    Math.cos(angle) * length,
    visitor.y -
    Math.sin(angle) * length
  );

  ctx.lineTo(
    visitor.x,
    visitor.y
  );

  ctx.stroke();
}


/* ---------------------------------------
   MAIN LOOP
--------------------------------------- */

function draw(timestamp) {

  time = timestamp;

  drawBackground();

  drawDust();

  drawGround();

  updateVisitor();

  drawTrace();

  drawVisitor();


  /*
    Pointer interaction remains extremely
    quiet. No obvious UI response.
  */

  if (pointer.active) {

    const dx =
      visitor.x -
      pointer.x;

    const dy =
      visitor.y -
      pointer.y;

    const distance =
      Math.sqrt(
        dx * dx +
        dy * dy
      );

    /*
      If you're close, a nearly invisible
      atmospheric disturbance appears.
    */

    if (distance < 240) {

      const influence =
        1 -
        distance / 240;

      ctx.strokeStyle =
        `rgba(
          220,
          214,
          198,
          ${influence * .018}
        )`;

      ctx.lineWidth = .5;

      ctx.beginPath();

      ctx.arc(
        visitor.x,
        visitor.y,
        8 +
        influence * 25,
        0,
        Math.PI * 2
      );

      ctx.stroke();
    }
  }


  requestAnimationFrame(draw);
}


/* ---------------------------------------
   START
--------------------------------------- */

resize();

requestAnimationFrame(draw);

</script>

</body>
</html>
